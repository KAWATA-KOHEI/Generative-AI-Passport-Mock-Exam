:var(--green)}.choice input{accent-color:var(--green);margin-top:6px;width:16px;height:16px;flex-shrink:0}.choice .n{font-size:11px;color:var(--muted);margin-top:3px}.choice.right{border-color:#608f64;background:#f0f6ed}.choice.wrong{border-color:#cb7770;background:#fff4f0}.mark{margin-left:auto;white-space:nowrap;font-size:11px;font-weight:700}.choice.wrong .mark{color:var(--red)}.qactions{display:flex;align-items:center;justify-content:space-between;margin-top:24px;gap:15px}.qactions small{color:var(--muted);font-size:11px}.feedback{margin-top:24px;border-top:1px solid var(--line);padding-top:22px}.feedback h3{font-size:19px;color:var(--green)}.feedback.incorrect h3{color:var(--orange)}.explanation{white-space:pre-wrap;line-height:1.95;font-size:13px;margin-top:18px}.answerline{font-size:12px;color:var(--muted)}details{border-top:1px solid var(--line);margin-top:20px;padding-top:14px;font-size:12px}summary{cursor:pointer;color:var(--green)}.refs{padding-left:20px;overflow-wrap:anywhere}.quiz-nav{display:flex;justify-content:space-between;margin-top:20px}.empty{padding:55px 25px;text-align:center;background:white;border:1px solid var(--line);border-radius:18px}.empty p{margin:15px 0 25px}.filters{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 18px}input[type=search],select{padding:11px 14px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);min-width:0}input[type=search]{flex:1;min-width:180px}.question-list{display:grid;gap:10px}.list-row{display:flex;gap:17px;text-align:left;background:white;padding:18px;border:1px solid var(--line);border-radius:12px;align-items:center}.list-row:hover{border-color:#8eab98}.list-no{font-size:12px;color:var(--muted);width:24px;flex-shrink:0}.list-title{flex:1}.list-title small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.list-state{font-size:11px;white-space:nowrap;color:var(--green)}.mini-actions{display:flex;gap:8px;flex-wrap:wrap}.notice{padding:10px 14px;background:#fff0d <script>
const DATA = [{"num":1,"category":"リスク・法律・倫理","question":"ディープフェイク技術に関して、不適切な記述をしているものを選択してください。","choices":["詐欺やなりすましといった悪用のリスクが存在する。","法的な側面がまだ完全には整備されていない。","他人の映像や音声を使用すると、倫理的な制約に触れる可能性がある。","AIを用いることで、ディープフェイクによる生成物であることを常に見抜くことができる。"],"answer":[4],"type":"single","summary":"4, ここが違う：AIによる検知ツールはありますが、生成技術も進化し続けているため「必ず見抜ける」わけではありません。ディープフェイク技術は日々進化しており、人の目だけで完全に見破るのは難しくなっているとされ、「見抜けないこと」を前提とした脅威として認識する必要があるという指摘もあります。 \n\n\n1, 正しい：ディープフェイク音声やビデオによる詐欺も見られ、手口は巧妙化しています。 \n\n2, 正しい：技術の進化に法整備が追いついておらず、各国で規制の検討が進んでいる段階です。\n\n3, 正しい：本人の同意なく映像や音声を使うことは、肖像権・プライバシーなど倫理的・法的な問題につながり得ます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ディープフェイク、検知の限界、なりすまし詐欺、AI倫理","url":null},{"label":"総務省 令和6年版 情報通信白書：https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd141210.html","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r06/html/nd141210.html"},{"label":"日本ファクトチェックセンター（見分け方）：https://www.factcheckcenter.jp/explainer/others/howto-deepfake-verification/","url":"https://www.factcheckcenter.jp/explainer/others/howto-deepfake-verification/"},{"label":"GeNEE（危険性・規制状況）：https://genee.jp/contents/what-is-deepfake/","url":"https://genee.jp/contents/what-is-deepfake/"}]},{"num":2,"category":"生成AIの仕組み","question":"GPT-3の特徴として適切な記述をすべて選びなさい。（複数選択）","choices":["直感的な理解や外部知識へのアクセスを欠いている。","RLHFを用いており、人間のフィードバックに基づいて出力を修正する。","GPT-2より大幅にパラメータ数が増え、自然言語をより深く理解できるようになった。","微調整することなく、幅広い自然言語処理タスクを実行する能力を有する。"],"answer":[1,3,4],"type":"multi","summary":"1, 正しい：GPT-3は学習済みのテキストだけを使って答えるモデルです。検索などで外部の情報を取りにいく仕組みはなく、人間のような常識的・直感的な理解も持っていません。そのため、ハルシネーション（事実でない情報を生成すること）や、学習時点以降の新しい情報を取り込めないという限界があります。\n\n2, ここが違う：RLHF（人間のフィードバックによる強化学習）はGPT-3の特徴ではありません。GPT-3をもとにした後継のInstructGPTやChatGPTで導入された手法です。\n\n3, 正しい：GPT-3の最大モデルのパラメータ数は1750億です。GPT-2は15億なので、100倍以上に増えています。\n\n4, 正しい：GPT-3はファインチューニング（微調整）を行いません。それでもzero-shot学習やfew-shot学習で高い精度を出しています。プロンプト内の例示だけでタスクを解くこの方法は、In-Context Learningと呼ばれます。モデルのパラメータは更新しません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：GPT-3、1750億パラメータ、Few-shot / Zero-shot学習、In-Context Learning、RLHF、InstructGPT","url":null},{"label":"論文：Language Models are Few-Shot Learners（Brown et al., 2020, arXiv:2005.14165）","url":null},{"label":"キカガク（GPT-3とFew-shot learning）：https://www.kikagaku.co.jp/personal/blog/chat-gpt-few-shot-learning","url":"https://www.kikagaku.co.jp/personal/blog/chat-gpt-few-shot-learning"},{"label":"zero to one（G検定用語集 GPT-3）：https://zero2one.jp/ai-word/gpt-3-2/","url":"https://zero2one.jp/ai-word/gpt-3-2/"}]},{"num":3,"category":"AIの基礎","question":"過学習を防ぐための代表的な手法をすべて選びなさい。","choices":["正則化","RLHF","ドロップアウト","シーケンスの並行処理"],"answer":[1,3],"type":"multi","summary":"1, 正しい：正則化は、損失関数にペナルティ項（L1・L2など）を加えます。これで重みが大きくなりすぎるのを抑え、モデルが複雑になりすぎないようにします。\n2, ここが違う：RLHFは、人間のフィードバックで出力を好ましい方向へ調整する手法です。過学習対策ではありません。\n3, 正しい：ドロップアウトは、学習中にニューロンをランダムに無効化します。特定のニューロンへの依存を防ぐ、代表的な過学習対策です。\n4, ここが違う：シーケンスの並行処理はTransformerなどで計算を速くする仕組みです。過学習とは関係ありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：過学習、正則化（L1/L2）、ドロップアウト、早期終了（Early Stopping）、データ拡張","url":null}]},{"num":4,"category":"最新動向・サービス","question":"OpenAIが2025年1月に公開した、ブラウザ操作に特化したAIエージェントを選びなさい。","choices":["Operator","Image Generation","GPT-4o","Codex"],"answer":[1],"type":"single","summary":"1, 正しい：OpenAIは2025年1月23日（米国時間）に、Webブラウザを直接操作してタスクをこなすAIエージェント「Operator」を発表しました。サイトへのアクセスや閲覧、入力、クリック、スクロールといった操作を人の代わりに行います。\n2, ここが違う：Image Generationは画像生成の機能です。ブラウザ操作用のエージェントではありません。\n3, ここが違う：GPT-4oは2024年5月に公開されたマルチモーダルモデルです。なお、Operatorの中核モデル「CUA」は、GPT-4oの視覚能力と強化学習による推論力を組み合わせたものなので、ひっかけの選択肢です。\n4, ここが違う：Codexはコード生成・プログラミング支援向けのモデルやエージェントです。ブラウザ操作用ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Operator、AIエージェント、CUA（Computer-Using Agent）","url":null},{"label":"https://rozetta-square.jp/knowledge/9984/","url":"https://rozetta-square.jp/knowledge/9984/"},{"label":"https://chizaizukan.com/news/4MmHJJ7ktUUjlbemAguhrr","url":"https://chizaizukan.com/news/4MmHJJ7ktUUjlbemAguhrr"}]},{"num":5,"category":"生成AIの仕組み","question":"ALBERTは、どのモデルを軽量にすることを目的として開発されたか。","choices":["Transformerを軽量にするモデルである。","GPT-3を軽量にするモデルである。","RoBERTaを軽量にするモデルである。","BERTを軽量にするモデルである。"],"answer":[4],"type":"single","summary":"4, 正しい：ALBERTは「A Lite BERT」の略で、名前の通りBERTの軽量版です。層をまたいだパラメータ共有と、埋め込み行列を2つの小さな行列に分解する手法でパラメータ数を減らしています。\n1, ここが違う：Transformerは土台となるアーキテクチャです。直接の軽量化対象はBERTです。\n2, ここが違う：GPT-3は2020年登場で、ALBERT（2019年発表）より後のモデルです。系統も異なります。\n3, ここが違う：RoBERTaはBERTの学習方法を改良して性能を上げたモデルです。軽量化が目的ではなく、ALBERTの元になったモデルでもありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ALBERT（A Lite BERT）、パラメータ共有、埋め込みの因数分解、DistilBERT（こちらもBERT軽量化モデル）","url":null},{"label":"論文：https://ar5iv.labs.arxiv.org/html/1909.11942","url":"https://ar5iv.labs.arxiv.org/html/1909.11942"},{"label":"https://www.gigazine.net/news/20191224-google-ai-albert/","url":"https://www.gigazine.net/news/20191224-google-ai-albert/"}]},{"num":6,"category":"生成AIの仕組み","question":"Transformerモデルの特徴として不適切な記述を1つ選びなさい。","choices":["Attention Mechanismを用いて、入力された単語の重要度を得点付けし、各単語がテキスト内でどのように関連しているかを把握することが可能である。","従来のモデルに比べ、多くのデータを一度に処理することが可能で、トレーニング時間を短縮できる。","位置エンコーディングを用いて単語の位置情報を取り込むことで、単語の順序情報を保持できる。","データの順番に依存しており、時系列に従ってデータを処理する。"],"answer":[4],"type":"single","summary":"4, 不適切（これが答え）：データを順番に1つずつ処理するのは、RNNやLSTMの特徴です。Transformerは系列全体を並列に処理します。\n1, 適切：Self-Attentionで単語同士の関連度を計算するのが、Transformerの中心的な仕組みです。\n2, 適切：並列処理ができるため、RNNより学習を高速化・大規模化しやすいのが大きな利点です。\n3, 適切：並列処理では語順の情報が失われるため、位置エンコーディングで順序を補っています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Transformer、Self-Attention、並列処理、位置エンコーディング、RNN・LSTMとの違い","url":null},{"label":"論文：Attention Is All You Need（Vaswani et al., 2017）","url":null}]},{"num":7,"category":"AIの基礎","question":"ルールベースを用いたAIについて正しく説明している文章を1つ選びなさい。","choices":["学習プロセスを通じて、学習データのパターンを見出す手法である。","人間が事前に作成したルールや知識をコンピュータプログラムに組み込み、判断や処理を行う手法である。","人間が与えたデータを基に、自ら出力のルールを抽出し問題を解決する技術である。","未知のデータに関して、判断や予測を行う技術である。"],"answer":[2],"type":"single","summary":"2, 正しい：ルールベースAIは、人間が「もし〜ならば〜する」といったルールを作り込んで動かす方式です。エキスパートシステムが代表例です。\n1, ここが違う：データからパターンを学ぶのは機械学習の説明です。\n3, ここが違う：データから自らルールを抽出するのも機械学習（特に深層学習）の特徴です。ルールベースではルールを人間が与えます。\n4, ここが違う：未知のデータに対する予測（汎化）は、機械学習モデルの目的として説明されるものです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ルールベース、エキスパートシステム、if-thenルール、機械学習との違い","url":null}]},{"num":8,"category":"リスク・法律・倫理","question":"匿名加工情報の説明として正しい記述を1つ選びなさい。","choices":["匿名加工された情報は、加工前の個人情報と同じように個人を特定することができるため、同様の規制を受ける。","AIによって自動生成された情報であり、正確な情報が含まれている。","複数の個人情報を組み合わせることによって、特定の個人を識別できる情報。","特定の個人を識別することができないように個人情報を加工し、当該個人情報を復元できないようにした情報。"],"answer":[4],"type":"single","summary":"4, 正しい：匿名加工情報は、特定の個人を識別できず、かつ元の個人情報に復元もできないように加工した情報です。\n1, ここが違う：匿名加工情報は個人情報としての性質を失っています。一定の条件のもとでは、本人の同意なしに第三者へ提供することも認められています。\n2, ここが違う：AIが生成した情報ではありません。実在の個人情報を加工して作るものです。\n3, ここが違う：他の情報と組み合わせて個人を識別できるものは、「個人情報」そのものの説明です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：匿名加工情報、個人情報保護法、仮名加工情報との違い（仮名加工は復元可能＝可逆）","url":null},{"label":"個人情報保護委員会事務局資料：https://www.soumu.go.jp/main_content/000462276.pdf","url":"https://www.soumu.go.jp/main_content/000462276.pdf"},{"label":"https://biz.moneyforward.com/contract/basic/20995/","url":"https://biz.moneyforward.com/contract/basic/20995/"}]},{"num":9,"category":"活用・プロンプト","question":"以下の（ア）に当てはまる文章として、正しい選択肢を1つ選びなさい。\n動画生成は（ア）ため、各フレーム間の一貫性を保つことが重要である。","choices":["仮想空間に羅列されたピクセルの集合である","時間的に連続するフレームの集合である","色彩ごとに分割された画像の集合である","製作者の意図が反映されている"],"answer":[2],"type":"single","summary":"2, 正しい：動画は、時間軸に沿って並んだ静止画（フレーム）の連続です。前後のフレームで人物の顔や背景が急に変わると不自然になるため、「時間的一貫性」の維持が動画生成の大きな課題になります。\n1, ここが違う：ピクセルの集合という説明は、1枚の画像にも当てはまります。「時間的な連続」という動画固有の性質を説明していません。\n3, ここが違う：色彩ごとの分割（RGBチャンネルなど）は画像表現の話です。フレーム間の一貫性とは関係ありません。\n4, ここが違う：製作者の意図の反映は、フレーム間の一貫性が重要になる理由として文がつながりません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：動画生成AI、フレーム、時間的一貫性（Temporal Consistency）、Sora","url":null}]},{"num":10,"category":"活用・プロンプト","question":"音楽生成AIを利用する際のデメリットや注意点について、最も不適切な記述をしているものを1つ選びなさい。","choices":["著作権などの法的制約がある。","人間が音楽を作成する場合に比べ、作成に時間がかかる。","AIが生成した音楽では、人間の感情的な深みや複雑さを完全には捉えることができない。","AIが生成した音楽がストリーミングサービスに大量にアップロードされると、音楽家に対する報酬が減少する可能性がある。"],"answer":[2],"type":"single","summary":"2, 不適切（これが答え）：音楽生成AIは、数秒〜数分で楽曲を作れるのが大きなメリットです。人間より時間がかかるという記述は誤りです。\n1, 適切：学習データに含まれる既存曲との類似や、生成物の著作権の扱いなど、法的な課題があります。\n3, 適切：感情表現の深みや独創性では、人間の作曲家に及ばない面があると指摘されています。\n4, 適切：AI楽曲の大量アップロードで再生数が分散し、アーティストの収益が圧迫される懸念が実際に議論されています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：音楽生成AI（Suno、Udioなど）、著作権、ストリーミング報酬、AI楽曲の大量投稿問題","url":null}]},{"num":11,"category":"活用・プロンプト","question":"テキスト生成AIを利用する際のメリットについて、最も適切な記述をしている文章を1つ選びなさい。","choices":["差別的な表現を生成することはないため、倫理的な側面に留意せずともよい。","与えられたテキストの内容を理解し、関連する情報を補完・拡張することができる。","学習データによらず、幅広い専門知識を理解している。","大量の正解データを学習しているため、誤った情報や偽情報を生成することはない。"],"answer":[2],"type":"single","summary":"2, 正しい：入力された文章の文脈をふまえて、要約・補足・続きの作成などができるのがテキスト生成AIのメリットです。\n1, ここが違う：学習データに含まれる偏り（バイアス）により、差別的な表現を生成する可能性があります。倫理面への配慮は必須です。\n3, ここが違う：AIの知識は学習データに依存します。学習していない分野や、学習時点以降の新しい情報には対応できません。\n4, ここが違う：もっともらしい誤情報を生成する「ハルシネーション」が起こり得ます。出力内容の事実確認が必要です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：テキスト生成AI、LLM、ハルシネーション、バイアス、学習データ依存","url":null}]},{"num":12,"category":"生成AIの仕組み","question":"LSTMの特徴として不適切な記述を1つ選びなさい。","choices":["大規模データの学習には時間がかかる。","長文の自然言語を処理すると精度が低下する。","並列学習に適している。","シーケンスデータを処理するネットワークである。"],"answer":[3],"type":"single","summary":"3, 不適切（これが答え）：LSTMはRNNの一種で、前の時刻の計算結果を使って次を計算します。データを順番に処理するしかないため、並列学習には向きません。並列処理が得意なのはTransformerです。\n1, 適切：逐次処理のため、大規模データでは学習に時間がかかります。\n2, 適切：LSTMは通常のRNNより長期の依存関係を扱えますが、非常に長い文では離れた情報を保持しきれず、精度が落ちます。\n4, 適切：LSTMは、時系列や文章などのシーケンスデータを扱うためのネットワークです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：LSTM、RNN、勾配消失問題、ゲート機構（入力・忘却・出力ゲート）、Transformerとの比較","url":null}]},{"num":13,"category":"活用・プロンプト","question":"Zero-Shotプロンプティングに関する説明として適切な記述を1つ選びなさい。","choices":["入力データから出力を得ることを目的とせず、生成AIの出力を調整するために入力データを使用する手法である。","例示が0個の入力のことで、入力データに対する処理が遅く、複雑な質問に対する出力の信頼性が高い。","入力データから出力を得ることを目的とせず、入力データを生成AIに学習させることのみを目的とした手法である。","例示が0個の入力のことで、簡単な質問を入力する際に適している手法である。"],"answer":[4],"type":"single","summary":"4, 正しい：Zero-Shotプロンプティングは、例を示さず指示だけで回答させる手法です。手軽な反面、複雑なタスクでは精度が落ちやすいため、簡単な質問に向いています。\n1, ここが違う：Zero-Shotも、入力に対する出力（回答）を得ることが目的です。\n2, ここが違う：例示がない分、入力は短くなります。また複雑な質問では、例示を与えるFew-Shotの方が信頼性が上がります。\n3, ここが違う：プロンプティングではモデルのパラメータを更新しません。「学習させる」のはファインチューニングの説明です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Zero-Shot、One-Shot、Few-Shotプロンプティング、Chain-of-Thought、In-Context Learning","url":null}]},{"num":14,"category":"リスク・法律・倫理","question":"「AI事業者ガイドライン」において「AI開発者」に該当するものを全て選びなさい。","choices":["AIを活用して社内の業務効率化に取り組んでいる事業者","LLMの新モデルについて研究を行い、モデルの構築を行う事業者","生成AIの研修を受けている個人","構築済みモデルを使用してAIツールの開発及び販売を行う事業者"],"answer":[2],"type":"multi","summary":"ガイドラインでは、AIを扱う事業者を「AI開発者」「AI提供者」「AI利用者」の3つに分けています。\n\n2, 正しい：AI開発者は、AIシステムを開発する事業者です（研究開発を行う事業者も含みます）。モデル・アルゴリズムの開発、データ収集、前処理、学習、検証を通じてAIシステムを構築します。LLMの新モデルを研究・構築するのはこれに当たります。\n4, ここが違う：既存のモデルを使い、ツールとして組み込んで販売するのは、「AI提供者」（AIシステムをアプリケーションや製品に組み込んだサービスとして提供する事業者）に当たります。\n1, ここが違う：事業活動の中でAIシステムやサービスを使う事業者なので、「AI利用者」です。\n3, ここが違う：事業活動以外でAIを使う個人は「業務外利用者」で、そもそもガイドラインの対象外です。\n\n※ガイドラインは、ユースケースによって1つの事業者が複数の立場を兼ねることもあるとしています。4の事業者が自社でモデルの追加学習などを行うなら開発者にも当たり得ますが、問題文の「構築済みモデルを使用して」という書き方から、出題の意図は「提供者」だと考えられます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：AI事業者ガイドライン（総務省・経済産業省）、AI開発者・AI提供者・AI利用者、業務外利用者、データ提供者","url":null},{"label":"概要資料（第1.2版）：https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_2.pdf","url":"https://www.meti.go.jp/shingikai/mono_info_service/ai_shakai_jisso/pdf/20260331_2.pdf"},{"label":"デロイト解説：https://www.deloitte.com/jp/ja/services/consulting/perspectives/ai-guideline.html","url":"https://www.deloitte.com/jp/ja/services/consulting/perspectives/ai-guideline.html"}]},{"num":15,"category":"生成AIの仕組み","question":"画像生成AIの主なデータ生成手法として不適切な選択肢を全て選びなさい。","choices":["CNN","VAE","RNN","GAN"],"answer":[1,3],"type":"multi","summary":"1, 不適切（答え）：CNN（畳み込みニューラルネットワーク）は、画像分類や物体検出など画像を「認識」するための手法です。GANなどの内部部品として使われることはありますが、CNN単体はデータを生成する手法ではありません。\n3, 不適切（答え）：RNN（再帰型ニューラルネットワーク）は、文章や時系列などのシーケンスデータを扱う手法です。画像生成の主な手法ではありません。\n2, 適切：VAE（変分オートエンコーダ）は、データを潜在空間に圧縮し、そこから新しいデータを生成する代表的な生成モデルです。\n4, 適切：GAN（敵対的生成ネットワーク）は、生成器と識別器を競わせて本物らしい画像を作る代表的な生成モデルです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：生成モデル、VAE、GAN、拡散モデル（Diffusion Model）、識別モデルと生成モデルの違い","url":null}]},{"num":16,"category":"AIの基礎","question":"一般的に画像データを扱う際には膨大な計算が必要になるが、CNNは画像の一部分（局所的な領域）ごとに処理を行う。このことを何と呼ぶか。最も正しい選択肢を1つ選びなさい。","choices":["畳み込み","ファインチューニング","潜在ベクトル化","ノイズ除去"],"answer":[1],"type":"single","summary":"1, 正しい：畳み込みは、小さなフィルタ（カーネル）を画像上でずらしながら局所的な特徴を取り出す処理です。同じフィルタを使い回すため、パラメータ数と計算量を抑えられます。\n2, ここが違う：ファインチューニングは、学習済みモデルを別のタスク向けに追加学習させることです。\n3, ここが違う：潜在ベクトル化は、データを低次元の潜在空間の表現に変換することです。VAEなどで使われます。\n4, ここが違う：ノイズ除去は画像からノイズを取り除く処理です。拡散モデルの生成過程などで使われます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：CNN、畳み込み層、フィルタ（カーネル）、プーリング層、局所受容野、重み共有","url":null}]},{"num":17,"category":"リスク・法律・倫理","question":"フィッシング詐欺の説明として最も正しい記述を1つ選びなさい。","choices":["仮想通貨を不正にマイニングする詐欺","メールやWebサイトを通じてユーザーの個人情報を盗み出す詐欺","悪意あるアプリやファイルをBluetoothなどで飛ばし、それをダウンロードした被害者に金銭を要求する詐欺","商品やサービスの偽の広告を出し、消費者をだまして商品を購入させる詐欺"],"answer":[2],"type":"single","summary":"2, 正しい：フィッシング詐欺は、実在の企業などを装ったメールや偽サイトに誘導し、IDやパスワード、カード番号などを盗む手口です。\n1, ここが違う：他人のコンピュータで無断で仮想通貨をマイニングするのは「クリプトジャッキング」です。\n3, ここが違う：ファイルを暗号化するなどして金銭を要求するのは「ランサムウェア」の手口です。\n4, ここが違う：偽の広告で商品を買わせるのは「詐欺広告」や「偽ショッピングサイト」の手口です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：フィッシング詐欺、クリプトジャッキング、ランサムウェア、詐欺広告、生成AIによるフィッシングメールの巧妙化","url":null}]},{"num":18,"category":"AIの基礎","question":"ノーフリーランチ定理について正しく説明している文章を1つ選びなさい。","choices":["どんな問題に対しても最適なアルゴリズムが存在する。","様々な分野で応用可能なデータをもとにすれば、万能なアルゴリズムを作成できる。","どんな問題に対しても万能なアルゴリズムは存在しない。","特定の分野に対する能力を向上させることで、様々な分野でも性能を発揮する。"],"answer":[3],"type":"single","summary":"3, 正しい：ノーフリーランチ定理は、あらゆる問題で他より優れた性能を出す万能のアルゴリズムは存在しない、という定理です。問題ごとに適したアルゴリズムを選ぶ必要があります。\n1, ここが違う：「どんな問題に対しても」通用する最適なアルゴリズムの存在は、定理と逆の内容です。\n2, ここが違う：データを工夫しても、万能なアルゴリズムは作れません。\n4, ここが違う：ある問題に特化して性能を上げると、別の問題では性能が落ちるというのが定理の考え方です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ノーフリーランチ定理（Wolpert & Macready, 1997）、醜いアヒルの子定理、バーニーおじさんのルール（G検定頻出の定理・法則）","url":null}]},{"num":19,"category":"活用・プロンプト","question":"テキスト生成AIにより処理可能なタスクとして最も不適切な記述を1つ選びなさい。","choices":["自動でユーザーの過去の行動を自動で取得し、将来の行動を予測した出力をすることができる。","未経験の業務のプロセスとその順番を分解して教えてくれる。","打ち合わせや会議の簡単なスケジュール例を作成することができる。","役割や人物像を与えることでディベートを行うことができる。"],"answer":[1],"type":"single","summary":"1, 不適切（これが答え）：テキスト生成AIは、入力されたテキストに対して応答するものです。ユーザーの過去の行動を自分で取得したり、それをもとに将来の行動を予測したりする機能は、基本的にありません。\n2, 適切：業務手順の分解や説明は、テキスト生成AIが得意とするタスクです。\n3, 適切：会議のアジェンダやスケジュール案の作成にも使えます。\n4, 適切：ロール（役割）を与えるプロンプトで、ディベートの相手役などを演じさせることができます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：テキスト生成AI、ロールプロンプティング、タスク分解、生成AIの活用例","url":null}]},{"num":20,"category":"リスク・法律・倫理","question":"「人間中心のAI社会原則」の中の「AI社会原則」として示されていない原則を1つ選びなさい。","choices":["セキュリティ確保","公正競争確保","多様性の確保","プライバシー確保"],"answer":[3],"type":"single","summary":"「人間中心のAI社会原則」（2019年、内閣府）のAI社会原則は、次の7つです。\n人間中心／教育・リテラシー／プライバシー確保／セキュリティ確保／公正競争確保／公平性・説明責任及び透明性／イノベーション\n\n3, 示されていない（これが答え）：「多様性」は社会原則ではありません。3つの「基本理念」の1つ、「多様な背景を持つ人々が多様な幸せを追求できる社会（Diversity & Inclusion）」に含まれる考え方です。社会原則と基本理念を混同させるひっかけです。\n1, ここが違う：「セキュリティ確保の原則」として示されています。\n2, ここが違う：「公正競争確保の原則」として示されています。\n4, ここが違う：「プライバシー確保の原則」として示されています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：人間中心のAI社会原則（2019年・内閣府）、基本理念（Dignity／Diversity & Inclusion／Sustainability）、7つの社会原則","url":null},{"label":"総務省 令和8年版 情報通信白書：https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r08/html/nd134000.html","url":"https://www.soumu.go.jp/johotsusintokei/whitepaper/ja/r08/html/nd134000.html"},{"label":"総務省資料（基本理念と社会原則の構成）：https://www.soumu.go.jp/main_content/000619783.pdf","url":"https://www.soumu.go.jp/main_content/000619783.pdf"}]},{"num":21,"category":"最新動向・サービス","question":"AIエージェントの2つの実装アプローチである「ワークフロー型」と「自律型」に関する説明として最も適切なものを次の中から選びなさい。","choices":["自律型はあらかじめフローを固定するため品質を管理しやすいが、ワークフロー型は未知の状況にも柔軟に対応できる。","自律型は受注処理や請求書発行などの定型業務に向いているが、ワークフロー型はマーケット調査などで力を発揮する。","ワークフロー型は手順が明確なタスクに向いているのに対し、自律型は状況が流動的なタスクで力を発揮する。","ワークフロー型も自律型も、ユーザーが最終目標だけを与えれば、試行錯誤を繰り返しながら自律的に処理を進めることができる。"],"answer":[3],"type":"single","summary":"3, 正しい：ワークフロー型は、人間が決めた手順（フロー）に沿って処理を進める方式です。定型業務に向いています。自律型は、AIが状況に応じて自分で手順を考え、ツールを選んで実行する方式です。調査など先が読めないタスクに向いています。\n1, ここが違う：説明が逆です。フローを固定して品質を管理しやすいのはワークフロー型、未知の状況に柔軟に対応できるのは自律型です。\n2, ここが違う：これも逆です。受注処理や請求書発行などの定型業務はワークフロー型、マーケット調査は自律型に向いています。\n4, ここが違う：最終目標だけを与えて試行錯誤させるのは自律型の特徴です。ワークフロー型は、あらかじめ定めた手順に従って動きます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：AIエージェント、ワークフロー型、自律型（エージェント型）、定型業務と非定型業務","url":null},{"label":"Anthropic「Building effective agents」（ワークフローとエージェントの違いを解説）","url":null}]},{"num":22,"category":"生成AIの仕組み","question":"ChatGPTに関して不適切な記述をしている文章を1つ選びなさい。","choices":["自然言語処理タスクに用いられる。","事前学習とファインチューニングの2段階で訓練される。","敵対的生成ネットワーク(GAN)を使用して訓練される。","強化学習の手法を取り入れている。"],"answer":[3],"type":"single","summary":"3, 不適切（これが答え）：ChatGPTは、Transformerベースの大規模言語モデル（GPT）です。GANは、主に画像生成で使われる別の生成モデルで、ChatGPTの訓練には使われていません。\n1, 適切：ChatGPTは、対話・要約・翻訳などの自然言語処理タスクに使われます。\n2, 適切：大量のテキストでの事前学習のあと、指示に従うよう調整するファインチューニングを行います。\n4, 適切：人間のフィードバックによる強化学習（RLHF）を取り入れています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ChatGPT、GPT、Transformer、事前学習、ファインチューニング、RLHF、InstructGPT、GAN","url":null}]},{"num":23,"category":"活用・プロンプト","question":"テキスト生成AIにより処理可能なタスクとして最も不適切な記述を1つ選びなさい。","choices":["正確に長文を要約することができる。","文章の構成や表現、文法の誤りの訂正など簡単な校正ができる。","指定した英単語の含まれるランダムな英文を作成することができる。","句読点や段落の区切りなどを挿入するといった文章の整理ができる。"],"answer":[1],"type":"single","summary":"1, 不適切（これが答え）：要約自体はできますが、「正確に」が誤りです。長文では重要な情報が抜け落ちたり、元の文章にない内容が混ざったり（ハルシネーション）することがあります。そのため、常に正確とは言えません。\n2, 適切：文章構成の改善、表現の見直し、文法の誤りの修正などの簡単な校正は得意です。\n3, 適切：指定した単語を含む例文を作るのは、生成AIの典型的な使い方です。\n4, 適切：句読点や改行・段落の挿入など、文章を読みやすく整えることもできます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：テキスト生成AI、要約、ハルシネーション、校正、ファクトチェック","url":null}]},{"num":24,"category":"AIの基礎","question":"機械学習について正しく説明している文章を1つ選びなさい。","choices":["ルールベースに基づいた学習手法である。","コンピュータ自身がデータからパターンを見出し、予測や判断を行う技術である。","コンピュータに特定のタスクを遂行させるために、そのタスクの具体的な手順を段階的に教える学習方法である。","アクチュエータを動かすための学習方法である。"],"answer":[2],"type":"single","summary":"2, 正しい：機械学習では、人間がルールを書くのではなく、コンピュータがデータからパターンや規則性を学びます。その結果をもとに、未知のデータに対する予測や判断を行います。\n1, ここが違う：ルールベースは、人間があらかじめルールを作り込む方式です。データから学ぶ機械学習とは対になる考え方です。\n3, ここが違う：具体的な手順を1つずつ教え込むのは、従来のプログラミングやルールベースの考え方です。\n4, ここが違う：アクチュエータ（モーターなど機械を動かす装置）の制御はロボティクスの分野の話です。機械学習の定義ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：機械学習、ルールベース、教師あり学習・教師なし学習・強化学習、特徴量","url":null}]},{"num":25,"category":"最新動向・サービス","question":"Code Interpreterの説明として最も適切なものを1つ選びなさい。","choices":["ソースコードを読み込んで解説記事を作成することができる機能","画像や音声などのマルチモーダルな出力を実現するための機能","ChatGPTをカスタマイズすることができる機能","Pythonのソースコードを作成し自ら実行することができる機能"],"answer":[4],"type":"single","summary":"4, 正しい：Code Interpreterは、ChatGPTがPythonコードを書き、そのまま実行環境で動かして結果を返す機能です。データ分析、グラフ作成、ファイル変換などに使われます。後に「Advanced Data Analysis（データ分析）」と名称が変わりました。\n1, ここが違う：コードの解説文を書くのは、通常のテキスト生成でもできます。Code Interpreterの本質は「コードを実行できること」です。\n2, ここが違う：画像生成や音声対話は、DALL·Eや音声モードなど別の機能です。\n3, ここが違う：ChatGPTを用途に合わせてカスタマイズする機能は「GPTs」や「カスタム指示」です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Code Interpreter、Advanced Data Analysis、ChatGPTプラグイン、GPTs、カスタム指示","url":null}]},{"num":26,"category":"リスク・法律・倫理","question":"データを無断で暗号化し使用者に身代金を要求する詐欺に用いられるマルウェアは何か。正しい選択肢を1つ選びなさい。","choices":["アドウェア","スパイウェア","ワーム","ランサムウェア"],"answer":[4],"type":"single","summary":"4, 正しい：ランサムウェアは「Ransom（身代金）」と「Software」を組み合わせた造語です。ファイルを暗号化して使えなくし、元に戻す代わりに金銭を要求します。\n1, ここが違う：アドウェアは、勝手に広告を表示するソフトウェアです。\n2, ここが違う：スパイウェアは、利用者に気づかれないように個人情報や操作履歴を盗み出すソフトウェアです。\n3, ここが違う：ワームは、ネットワークを通じて自分自身を複製し、他のコンピュータへ次々と感染を広げるマルウェアです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：マルウェア、ランサムウェア、アドウェア、スパイウェア、ワーム、トロイの木馬","url":null},{"label":"IPA「情報セキュリティ10大脅威」（ランサムウェアは組織編で上位の常連）","url":null}]},{"num":27,"category":"生成AIの仕組み","question":"プレトレーニングに関する説明として正しい記述を1つ選びなさい。","choices":["LLM研究者がLLM作成に取り掛かる前に学習すべき事前学習のことである。","大量のテキストデータを使用した教師なし学習が用いられる。","特定のタスクの性能のみを向上させるトレーニングのことである。","学習済みモデルに対して一時的な評価をすることを目的として行われるトレーニングである。"],"answer":[2],"type":"single","summary":"2, 正しい：プレトレーニング（事前学習）では、Web上などの大量のテキストを使い、「次の単語を予測する」形で言語の一般的な知識を学ばせます。人間が正解ラベルを付ける必要がないため、教師なし学習（厳密には自己教師あり学習）と呼ばれます。\n3, ここが違う：特定のタスク向けに性能を高めるのは「ファインチューニング」です。プレトレーニングは、幅広いタスクに使える汎用的な能力を身につける段階です。ひっかけの選択肢です。\n1, ここが違う：「事前学習」は、人間の研究者が勉強することではありません。モデル自体を学習させることを指します。\n4, ここが違う：学習済みモデルの評価は「評価（テスト）」の工程です。トレーニングとは別物です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：プレトレーニング（事前学習）、自己教師あり学習、次単語予測、ファインチューニング、基盤モデル","url":null}]},{"num":28,"category":"リスク・法律・倫理","question":"マルウェアへの対策について、不適切な記述をしている文章を1つ選びなさい。","choices":["アンチウイルスソフトウェアを常に最新の状態に保ち、定期的にシステムスキャンを行うことが重要である。","データをダウンロードする前に、ファイルのソースを確認することが重要である。","ファイアウォールやアンチウイルスソフトウェアを使用し、一度データをダウンロードすることでマルウェアの危険性を確認することが重要である。","送信元が不明なメールの添付ファイルを開かないようにすることが重要である。"],"answer":[3],"type":"single","summary":"3, 不適切（これが答え）：危険性を確かめるために「一度ダウンロードしてみる」こと自体が、感染のリスクを高めます。怪しいファイルは、ダウンロードする前に避けるのが基本です。\n1, 適切：ソフトを最新に保てば新しいマルウェアにも対応でき、定期スキャンで感染を早期に発見できます。\n2, 適切：公式サイトなど信頼できる入手元かを事前に確認することは、基本的な対策です。\n4, 適切：不審なメールの添付ファイルは、マルウェア感染の代表的な経路です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：マルウェア対策、アンチウイルスソフト、ファイアウォール、標的型攻撃メール","url":null},{"label":"IPA「情報セキュリティ10大脅威」","url":null}]},{"num":29,"category":"リスク・法律・倫理","question":"テキスト生成AIが完全に排除できない事象をすべて選びなさい。（複数選択可）","choices":["文法ミスや誤字の生成","データの偏りに基づく内容の生成","偏見や差別的な表現の生成","偽情報や誤った情報の生成"],"answer":[2,3,4],"type":"multi","summary":"2, 正しい：学習データに含まれる偏りは、出力にも反映されます。データを完全に偏りなく整えることは難しく、完全には排除できません。\n3, 正しい：学習データに差別的・偏見のある表現が含まれていると、それを再現してしまうことがあります。安全対策をしても、完全には防げません。\n4, 正しい：もっともらしい誤情報を生成する「ハルシネーション」は、現在の技術では完全には防げません。\n1, ここが違う：LLMは大量の文章から学習しているため、文法的に自然な文章を作るのは得意です。出題の意図としては、AI特有の課題（バイアス・差別表現・ハルシネーション）を選ばせる問題と考えられます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ハルシネーション、バイアス、学習データの偏り、AI倫理、ファクトチェック","url":null}]},{"num":30,"category":"AIの基礎","question":"転移学習について正しく説明している文章を1つ選びなさい。","choices":["複数の異なるデータセットを同時に学習する手法。","異なるタスク間で交互にデータセットを与え学習を行う手法。","1つの問題で学習したモデルの知識を、別の問題へ適用する手法。","学習済みのモデルを捨て、新しいタスクに対して完全に新しいモデルを作り直す手法。"],"answer":[3],"type":"single","summary":"3, 正しい：転移学習は、あるタスクで学習済みのモデルの知識を、別のタスクに活用する手法です。少ないデータや計算量でも高い精度を出しやすくなります。例えば、大量の画像で学習したモデルを流用して、特定の製品の不良品検知に使うといった使い方です。\n1, ここが違う：複数のタスクやデータを同時に学習するのは「マルチタスク学習」の説明です。\n2, ここが違う：タスクを交互に切り替えて学習する方法も、転移学習の定義ではありません。\n4, ここが違う：学習済みモデルを捨てて一から作り直すのは、転移学習とは正反対の考え方です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：転移学習、ファインチューニング、マルチタスク学習、事前学習済みモデル","url":null}]},{"num":31,"category":"リスク・法律・倫理","question":"営業秘密の保護を受けるために必要な要件として当てはまらない選択肢を1つ選びなさい。","choices":["非公知性","特殊情報性","有用性","秘密管理性"],"answer":[2],"type":"single","summary":"不正競争防止法で「営業秘密」として保護されるには、「秘密管理性」「有用性」「非公知性」の3要件をすべて満たす必要があります。\n\n2, 当てはまらない（これが答え）：「特殊情報性」という要件はありません。それらしく作られたひっかけの選択肢です。\n1, 要件である：非公知性とは、一般に知られておらず、公開された資料などから簡単に手に入らないことです。\n3, 要件である：有用性とは、事業活動に役立つ技術上・営業上の情報であることです。\n4, 要件である：秘密管理性とは、アクセス制限や「社外秘」の表示などで、秘密として管理されていることです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：営業秘密、不正競争防止法、営業秘密の3要件（秘密管理性・有用性・非公知性）","url":null},{"label":"経済産業省「営業秘密管理指針」","url":null}]},{"num":32,"category":"AIの基礎","question":"計算リソースが制限されている環境の例として不適切な記述を1つ選びなさい。","choices":["小さなバッテリーを使用した機器の場合","低コストのパソコンを使用する場合","スマートフォンを使用する場合","大型のサーバーを使用する場合"],"answer":[4],"type":"single","summary":"4, 不適切（これが答え）：大型サーバーは、高性能なCPU・GPUと大容量のメモリを備えています。計算リソースが豊富な環境の代表例で、「制限されている環境」には当たりません。\n1, 適切：小型バッテリーで動くIoT機器などは消費電力を抑える必要があるため、計算リソースが制限されます（エッジAIの例）。\n2, 適切：低価格のパソコンは、CPUやメモリの性能が限られています。\n3, 適切：スマートフォンは、サイズやバッテリー、発熱の制約から、サーバーに比べて計算リソースが限られています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：エッジAI、モデル軽量化（蒸留・量子化・プルーニング）、オンデバイスAI、クラウドとエッジの違い","url":null}]},{"num":33,"category":"AIの基礎","question":"教師なし学習の代表的な手法として適切な選択肢をすべて選びなさい。（複数選択可）","choices":["次元削減","クラスタリング","ドロップアウト","アライメント"],"answer":[1,2],"type":"multi","summary":"1, 正しい：次元削減は、多くの特徴量を持つデータを、情報をなるべく保ったまま少ない次元に圧縮する手法です。主成分分析（PCA）などがあり、正解ラベルを使わない教師なし学習の代表例です。\n2, 正しい：クラスタリングは、正解ラベルなしで、似たデータ同士をグループ分けする手法です。k-means法などがあります。\n3, ここが違う：ドロップアウトは、ニューラルネットワークの過学習を防ぐテクニックです。学習の種類（教師なし学習）の手法ではありません。\n4, ここが違う：アライメントは、AIの振る舞いを人間の意図や価値観に沿うよう調整することです（RLHFなど）。教師なし学習の手法ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：教師なし学習、クラスタリング（k-means）、次元削減（主成分分析・PCA）、教師あり学習との違い","url":null}]},{"num":34,"category":"AIの基礎","question":"人工ニューロンの説明として、最も適切な記述を1つ選びなさい。","choices":["神経細胞の突起である。","人間の脳の一部である。","脳の神経細胞の仕組みをプログラミングによって再現したものである。","ニューラルネットワークの派生技術である。"],"answer":[3],"type":"single","summary":"3, 正しい：人工ニューロンは、脳の神経細胞（ニューロン）の働きを数式で模したものです。複数の入力に重みをかけて足し合わせ、活性化関数を通して出力します。\n1, ここが違う：神経細胞の突起は、生物の神経細胞にある樹状突起や軸索のことです。\n2, ここが違う：人工ニューロンは、実際の脳の一部ではなく、コンピュータ上のモデルです。\n4, ここが違う：関係が逆です。人工ニューロンを多数つなげたものがニューラルネットワークです。人工ニューロンはその構成要素であり、派生技術ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：人工ニューロン、形式ニューロン（マカロック・ピッツ）、パーセプトロン、重み、活性化関数","url":null}]},{"num":35,"category":"リスク・法律・倫理","question":"不正競争防止法の目的として正しい選択肢を1つ選びなさい。","choices":["国際的な約束の公開を促すこと","国民経済の過度な成長を妨げること","事業者間の公正な競争を保証すること","企業の独占的利益を確保すること"],"answer":[3],"type":"single","summary":"不正競争防止法第1条では、「事業者間の公正な競争及びこれに関する国際約束の的確な実施を確保する」ことで、「国民経済の健全な発展に寄与する」ことを目的としています。\n\n3, 正しい：事業者間の公正な競争の確保は、この法律の中心的な目的です。\n1, ここが違う：条文にあるのは、国際約束の「的確な実施」の確保です。「公開を促す」ではありません。条文の言葉を少し変えたひっかけです。\n2, ここが違う：目的は国民経済の「健全な発展」に寄与することです。成長を妨げることではありません。\n4, ここが違う：特定の企業の独占的な利益を守る法律ではありません。公正な競争環境を守るための法律です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：不正競争防止法（第1条 目的）、営業秘密、限定提供データ、公正な競争","url":null},{"label":"経済産業省「不正競争防止法」解説ページ","url":null}]},{"num":36,"category":"AIの基礎","question":"クラスタリングについて正しく説明している文章を1つ選びなさい。","choices":["与えられたデータをランダムに2つのグループに分ける手法である。","与えられたデータを似た特徴やパターンを持つグループに分類する手法である。","過去のデータを基に未来の値を予測する手法である。","データの未知の因果関連を予測するための統計的手法である。"],"answer":[2],"type":"single","summary":"2, 正しい：クラスタリングは、正解ラベルのないデータを、特徴の似たもの同士でグループ（クラスタ）に分ける教師なし学習の手法です。\n1, ここが違う：分け方はランダムではなく、データの類似度にもとづきます。グループの数も2つに限りません。\n3, ここが違う：過去のデータから未来の値を予測するのは、回帰や時系列予測（教師あり学習）の説明です。\n4, ここが違う：因果関係の推定は因果推論の分野の話です。クラスタリングの説明ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：クラスタリング、k-means法、階層的クラスタリング、教師なし学習、分類（教師あり）との違い","url":null}]},{"num":37,"category":"リスク・法律・倫理","question":"AI生成物に関する事実確認において、留意すべき点を述べた文章として不適切な記述を1つ選びなさい。","choices":["生成した映像や音声が他の著作物と酷似していることで、これに接する者の誤解を生む恐れがある。","AI生成物については、生成AIを用いて生成した旨を明示することが推奨される。","AI生成物は必ず正しい情報を出力するため、直接的な表現により他者の権利等を侵す恐れがある。","誤解を招く可能性のある虚偽の情報を広めないように注意が必要である。"],"answer":[3],"type":"single","summary":"3, 不適切（これが答え）：AI生成物が「必ず正しい情報を出力する」ことはありません。ハルシネーション（もっともらしい誤情報）が起こり得るため、事実確認が必要です。\n1, 適切：既存の作品に酷似した生成物は、見る人の誤認を招いたり、著作権侵害につながったりする恐れがあります。\n2, 適切：AIで生成したことを明示するのは、透明性の観点から推奨されています。\n4, 適切：生成AIの出力を確認せずに広めると、偽情報の拡散に加担する恐れがあります。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ハルシネーション、ファクトチェック、AI生成物の明示（透明性）、偽情報・誤情報、著作権","url":null},{"label":"【問題38】","url":null}]},{"num":38,"category":"AIの基礎","question":"シンギュラリティを初めて提唱した人物名として正しい選択肢を1つ選びなさい。","choices":["クロード・シャノン","レイ・カーツワイル","ヴァーナー・ヴィンジ","ジョン・マッカーシー"],"answer":[3],"type":"single","summary":"3, 正しい：ヴァーナー・ヴィンジは、米国の数学者・SF作家です。1993年の論文「The Coming Technological Singularity」で、AIが人間の知能を超える転換点という概念を整理しました。生成AIパスポートの試験対策でも、ヴィンジは「初めて提唱」、カーツワイルは「理論を具体化し2045年問題を提唱」と区別して整理されています。\n2, ここが違う：レイ・カーツワイルは、2005年の著書『ポスト・ヒューマン誕生（The Singularity Is Near）』で「2045年」という具体的な予測を示し、シンギュラリティを世に広めた人物です。有名なので選びたくなりますが、「初めて提唱」ではありません。ひっかけの選択肢です。\n1, ここが違う：クロード・シャノンは「情報理論の父」と呼ばれる人物です。\n4, ここが違う：ジョン・マッカーシーは、1956年のダートマス会議で「人工知能（Artificial Intelligence）」という言葉を初めて使った人物です。\n\n※厳密には、1950年代にフォン・ノイマンが技術的な文脈でこの言葉を使ったとされます。ただ、選択肢の中ではヴィンジが正解です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：シンギュラリティ（技術的特異点）、ヴァーナー・ヴィンジ、レイ・カーツワイル、2045年問題、収穫加速の法則、ダートマス会議","url":null},{"label":"生成AIパスポート対策記事：https://note.com/digisapo/n/n816cbcbc12ed","url":"https://note.com/digisapo/n/n816cbcbc12ed"},{"label":"https://korecara-ai.com/singularity-history/","url":"https://korecara-ai.com/singularity-history/"}]},{"num":39,"category":"最新動向・サービス","question":"ChatGPTリリース当初に採用されたモデルに関して、最も不適切な記述をしている文章を1つ選びなさい。","choices":["正確な文字数の指定は不得意とされている。","最新の時事情報などの出力は不得意とされている。","プログラミングのコード生成は不得意とされている。","計算問題は不得意とされている。"],"answer":[3],"type":"single","summary":"3, 不適切（これが答え）：リリース当初のモデル（GPT-3.5）の時点で、コード生成は得意分野の1つでした。コードの作成・説明・修正に広く使われていました。\n1, 適切：LLMは文字ではなく「トークン」単位で文章を処理するため、「○文字ちょうど」などの正確な文字数指定は苦手です。\n2, 適切：当初は検索機能がなく、学習データの期限（知識のカットオフ）以降の情報は出力できませんでした。\n4, 適切：計算を実際に行うのではなく、次に来そうな文字を予測して出力するため、桁の多い計算などで間違えやすいとされていました。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ChatGPT（2022年11月公開）、GPT-3.5、トークン、知識のカットオフ、ハルシネーション","url":null},{"label":"【問題40】","url":null}]},{"num":40,"category":"生成AIの仕組み","question":"ボルツマンマシンと制約付きボルツマンマシンについて正しく説明している文章を1つ選びなさい。","choices":["制約付きボルツマンマシンは、ボルツマンマシンと比べて、ネットワークの入力部分と推定する部分を一体化した結果、学習が容易になり扱いやすくなった。","制約付きボルツマンマシンはボルツマンマシンと比べて、ネットワーク間のやりとりがランダム化され、学習に必要なデータを十分に活用できない。","制約付きボルツマンマシンは、ボルツマンマシンと同じく、ネットワーク間のやりとりがランダムであり、教師なし学習のみが可能である。","制約付きボルツマンマシンは、ボルツマンマシンとは異なり、ネットワークの入力部分と推定する部分の2つの構成に分けることで、教師あり学習と教師なし学習の両方が可能になった。"],"answer":[4],"type":"single","summary":"4, 正しい：制約付きボルツマンマシン（RBM）は、ネットワークを「可視層（入力部分）」と「隠れ層（推定する部分）」の2層に分け、同じ層の中の結合をなくしたモデルです。これで学習しやすくなりました。教師なしの事前学習だけでなく、分類などの教師ありのタスクにも応用されます。\n1, ここが違う：RBMは入力部分と推定する部分を「分けた」モデルです。「一体化」は逆の説明です。\n2, ここが違う：層内の結合をなくして構造を単純にしたことで、学習は効率的になりました。「データを十分に活用できない」は誤りです。\n3, ここが違う：RBMは教師なし学習だけに限られません。\n\n※選択肢1の画面の文字（「一体化」の部分）が小さく、読み取りに自信がありません。画面で1が「2つに分けた」という内容になっている場合は、判断が変わる可能性があります。","explanations":[],"keywords":[],"references":[{"label":"キーワード：ボルツマンマシン、制約付き（制限付き）ボルツマンマシン（RBM）、可視層・隠れ層、深層信念ネットワーク（DBN）、事前学習","url":null},{"label":"G検定用語集：https://zero2one.jp/ai-word/restricted-boltzmann-machine/","url":"https://zero2one.jp/ai-word/restricted-boltzmann-machine/"}]},{"num":41,"category":"活用・プロンプト","question":"LLMにおける「Temperature」と「Top-p」に関する説明として最も適切な記述を1つ選びなさい。","choices":["LLMのバージョンによって異なる数値設定がされている。","LLMの重さを決定するためのものである。","LLMの学習内容を制御するためのものである。","値は常に固定されており、変更することはできない。"],"answer":[1],"type":"single","summary":"TemperatureとTop-pは、LLMが次の単語を選ぶときの「ランダムさ（多様性）」を調整するパラメータです。Temperatureが低いと安定した回答に、高いと多様で創造的な回答になります。Top-pは、確率の高い候補から累積でp（例：0.9）に達するまでの単語だけを候補にします。\n\n1, 正しい：初期設定値はモデルやバージョン、サービスによって異なります。消去法でもこれが最も適切です。\n2, ここが違う：モデルの「重さ（重みやサイズ）」を決めるものではありません。重みは学習によって決まるもので、TemperatureやTop-pは出力時の設定です。\n3, ここが違う：学習内容には影響しません。学習後、文章を生成するときの出力の傾向を調整するものです。\n4, ここが違う：APIやプレイグラウンドなどで、ユーザーが自由に値を変更できます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Temperature、Top-p（Nucleus Sampling）、Top-k、サンプリング、ハイパーパラメータ","url":null}]},{"num":42,"category":"最新動向・サービス","question":"GPT-5に関する説明として最も最適なものを一つ選びなさい。","choices":["博士号レベルの専門性が不要なタスクにのみ対応可能である。","推論モデルであるGPT-5 thinkingは、o3モデルと比較してハルシネーションが約20%増加した。","2025年8月に公開されたが、以前のモデルより推論速度は低下した。","ChatGPTでは「GPT-5」「GPT-5 Thinking」「GPT-5 Pro」の3つのモデルが使用可能である。"],"answer":[4],"type":"single","summary":"4, 正しい：2025年8月の公開時、ChatGPTでは標準の「GPT-5」、じっくり推論する「GPT-5 Thinking」、上位プラン向けの「GPT-5 Pro」が提供されました。\n1, ここが違う：OpenAIは、GPT-5を「博士号レベルの専門家と話しているような」モデルとして発表しました。専門性の高いタスクにも対応できます。\n2, ここが違う：GPT-5 thinkingは、o3に比べて事実誤りのある回答が大幅に「減少」したと発表されています。「増加」は逆です。\n3, ここが違う：公開時期（2025年8月）は正しいですが、速度が低下したわけではありません。質問に応じて速く答えるか深く考えるかを自動で切り替え、効率化が図られています。","explanations":[],"keywords":[],"references":[{"label":"キーワード：GPT-5（2025年8月7日公開）、GPT-5 Thinking、GPT-5 Pro、ルーター（自動切り替え）、ハルシネーション低減、o3","url":null}]},{"num":43,"category":"活用・プロンプト","question":"動画生成AIを利用する際のメリットについて、最も不適切な記述をしている文章を1つ選びなさい。","choices":["映像内の特定の要素を自動的に非表示にすることができる。","既存の映像コンテンツの雰囲気にあった音楽を挿入することができる。","既存の映像や動画を元に新しい映像を生成することができる。","特殊効果やリアルな視聴効果を生成することができる。"],"answer":[2],"type":"single","summary":"2, 不適切（これが答え）：映像の雰囲気に合う音楽（BGM）を作って挿入するのは、「音楽生成AI」のメリットとして整理される内容です。映像そのものを生成・編集する動画生成AIのメリットとは分野が異なる、と考えられます。\n1, 適切：映像内の不要な人物や物体を自動で消す（非表示にする）機能は、動画生成AIの代表的な編集機能です。\n3, 適切：既存の動画をもとにスタイルを変えたり新しい映像を作ったりする「Video-to-Video」は、動画生成AIの機能です。\n4, 適切：CGのような特殊効果や視覚効果を短時間で作れるのは、動画生成AIの大きなメリットです。\n\n※注意：最近は、音声や効果音まで同時に生成できる動画生成AI（Veo 3やSora 2など）も登場しています。ツールによってはBGMの自動挿入もできると紹介されているため、2も「できる」と解釈される余地があります。試験では、生成AIの分野（動画／音楽）を区別させる問題と判断して2を答えにしましたが、確度はやや低めです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：動画生成AI（Sora、Runway、Veoなど）、Video-to-Video、オブジェクト除去、音楽生成AI、マルチモーダル生成","url":null}]},{"num":44,"category":"リスク・法律・倫理","question":"2025年6月4日に公布された「AI新法」（人工知能関連技術の研究開発及び活用の推進に関する法律）の法的性格として、最も適切なものを次の中から選びなさい。","choices":["罰則規定を設けず、企業の自主性を尊重し、AIの開発・活用を主目的とする「推進法」である。","ディープフェイク対策に特化しており、その他のAI技術は対象外とする法律である。","EUのAI規制法と同様に、違反事業者には巨額の罰金を科す厳格な「規制法」である。","米国の動向に倣い、国による調査権限を一切認めず、企業の完全な自由に委ねる法律である。"],"answer":[1],"type":"single","summary":"1, 正しい：AI新法（AI推進法）は、日本で初めてのAIに関する包括的な法律です。罰則は設けず、AIの研究開発と活用の推進を主な目的とした「推進法」です。いわゆるソフトロー中心の考え方で、イノベーションを重視しています。\n2, ここが違う：ディープフェイクだけでなく、AI関連技術全般を対象としています。\n3, ここが違う：EUのAI法（違反時に高額の制裁金あり）とは異なり、罰則はありません。\n4, ここが違う：国が事業者に情報提供を求めたり、調査・指導・助言を行ったりする仕組みがあります。不適切な事案では事業者名の公表もあり得ます。「調査権限を一切認めない」は誤りです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：AI推進法（AI新法）、人工知能戦略本部、AI基本計画、ソフトロー、EU AI Act（規制法）との違い","url":null}]},{"num":45,"category":"リスク・法律・倫理","question":"AI新法において、AIを活用する「活用事業者」に課される責務に関して、他の主体（研究開発機関や国民など）と比較した場合の最も大きな特徴を次の中から選びなさい。","choices":["開発した生成AIが著作権を侵害した場合、1,000万円以下の罰金が科されるという、法律で定められた唯一の罰則規定の対象となること。","AI事業者ガイドラインを自社で独自に策定し、AI戦略本部に提出することが義務付けられていること。","AIの活用によって営業秘密が漏洩するリスクがあるため、従業員による生成AIの業務利用を一切禁止しなければならないこと。","国が実施する施策に対し、「努めるものとする」という努力義務ではなく、「協力しなければならない」というより強い責務が課されていること。"],"answer":[4],"type":"single","summary":"4, 正しい：AI新法第7条では、活用事業者は国や地方公共団体の施策に「協力しなければならない」とされています。法案段階から、対象ごとに努力義務の強さを調整する方針でした。研究機関には「努める」、事業者には「協力しなければならない」と書き分け、研究機関には事業者よりも弱い義務を課す設計になっています。\n1, ここが違う：AI新法には罰則規定がありません。全28条の中に、罰金や禁止行為に関する規定はありません。\n2, ここが違う：AI事業者ガイドラインは、総務省と経済産業省が策定したものです。各社に策定や提出を義務付ける規定はありません。\n3, ここが違う：この法律は、むしろ事業者にAIの積極的な活用を促しています。業務利用の全面禁止を求める規定はありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：AI推進法（AI新法）第7条 活用事業者の責務、努力義務、協力義務、研究開発機関の責務（第6条）","url":null},{"label":"長島・大野・常松 解説：https://businesslawyers.jp/articles/1475","url":"https://businesslawyers.jp/articles/1475"},{"label":"日刊工業新聞：https://newswitch.jp/p/44609","url":"https://newswitch.jp/p/44609"}]},{"num":46,"category":"最新動向・サービス","question":"次のモデルのうちリーズニングモデルでないものを選びなさい。","choices":["GPT-o4","GPT-o3","GPT-4o","GPT-o3mini"],"answer":[3],"type":"single","summary":"3, リーズニングモデルではない（これが答え）：GPT-4o（2024年5月公開）の「o」は「omni（オムニ）」の略です。テキスト・画像・音声を扱うマルチモーダルモデルですが、回答前に時間をかけて推論するリーズニングモデルではありません。\n1, ここが違う：o4（o4-miniなど）は、oシリーズのリーズニングモデルです。\n2, ここが違う：o3は、2025年に公開されたリーズニングモデルです。\n4, ここが違う：o3-miniは、o3を軽量化した高速・低コストのリーズニングモデルです。\n\n※「4o」と「o4」は名前が似ていて紛らわしいので、試験でよく狙われます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：リーズニングモデル（推論モデル）、oシリーズ（o1・o3・o4-mini）、GPT-4o（omni）、Chain-of-Thought","url":null}]},{"num":47,"category":"最新動向・サービス","question":"GPTsの説明として最も適切なものを1つ選びなさい。","choices":["ChatGPTをカスタマイズすることができる機能。","Pythonのソースコードを作成し自ら実行することができる機能。","画像や音声などのマルチモーダルな出力を実現するための機能。","ソースコードを読み込んで解説記事を作成することができる機能。"],"answer":[1],"type":"single","summary":"1, 正しい：GPTs（2023年11月発表）は、指示・知識ファイル・機能を組み合わせて、特定の用途向けのオリジナルChatGPTを作れる機能です。プログラミングの知識がなくても作成でき、GPTストアで公開・共有もできます。\n2, ここが違う：これは問題25で出た「Code Interpreter（データ分析）」の説明です。\n3, ここが違う：画像生成や音声対話は、DALL·Eや音声モードなど別の機能です。\n4, ここが違う：コードの解説文を書くのは、通常のテキスト生成でもできます。GPTsの定義ではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：GPTs、GPTストア、カスタム指示、Code Interpreter、OpenAI DevDay 2023","url":null}]},{"num":48,"category":"生成AIの仕組み","question":"Transformerモデルは従来のモデルにない機能を持ち、その後の研究に大きな影響を与えた。この機能の名称として適切な選択肢を1つ選びなさい。","choices":["勾配消失機能","マスク機能","自己注意力","リカレントメカニズム"],"answer":[3],"type":"single","summary":"3, 正しい：Transformerの中核は自己注意機構（Self-Attention）です。文中のすべての単語同士の関連度を一度に計算できるため、並列処理と長い文脈の理解が可能になり、GPTやBERTの基盤になりました。\n1, ここが違う：勾配消失は、深いネットワークやRNNで学習が進まなくなる「問題」の名前です。機能ではありません。\n2, ここが違う：マスクはTransformerの中でも使われますが、補助的な仕組みです。従来にない中核の機能は自己注意です。\n4, ここが違う：リカレント（再帰）構造はRNN・LSTMの特徴です。Transformerは、これを使わない点が画期的でした。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Self-Attention、Attention Is All You Need（2017）、RNNとの違い","url":null}]},{"num":49,"category":"生成AIの仕組み","question":"RAGシステムの活用として不適切なものを一つ選びなさい。","choices":["特定知識に特化した教育支援サービス","文字認識OCRシステム","社内のナレッジ文章の検索","マニュアルを学習したコールセンター支援ツール"],"answer":[2],"type":"single","summary":"2, 不適切（これが答え）：RAG（検索拡張生成）は、外部の文書を検索し、その内容をもとにLLMが回答を生成する仕組みです。画像から文字を読み取るOCRは、別の技術です。\n1, 適切：教材などの特定知識を検索して回答に使えます。\n3, 適切：社内文書を検索して回答するのは、RAGの代表的な活用例です。\n4, 適切：マニュアルを検索対象にして、オペレーターの回答を支援できます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：RAG（Retrieval-Augmented Generation）、ベクトル検索、ハルシネーション対策、OCR","url":null}]},{"num":50,"category":"最新動向・サービス","question":"OpenAIが提供する動画生成AI「Sora」が採用しているモデルのアーキテクチャとして、正しいものを一つ選びなさい。","choices":["transformerアーキテクチャを採用した拡散モデル","GPT-o4モデル","transformerアーキテクチャを採用した自己回帰モデル","o3派生モデル「codex-1」"],"answer":[1],"type":"single","summary":"1, 正しい：Soraは、Transformerを組み込んだ拡散モデル（Diffusion Transformer）です。ノイズから少しずつ映像を復元する方式で動画を生成します。\n2, ここが違う：o4（o4-mini）は、テキスト中心のリーズニングモデルです。動画生成モデルではありません。\n3, ここが違う：自己回帰モデルは、GPTのように前から順番に予測して生成する方式です。Soraは拡散モデルです。\n4, ここが違う：codex-1は、コーディングエージェント「Codex」用のo3派生モデルです。動画生成とは関係ありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Sora、拡散モデル、Diffusion Transformer（DiT）、自己回帰モデル、Codex","url":null}]},{"num":51,"category":"リスク・法律・倫理","question":"個人情報保護法に関連する記述として不適切な文章を1つ選びなさい。","choices":["個人情報保護法は2005年に全面施行された。","個人情報保護委員会は、個人情報の適切な取り扱いを監視・監督し、違反があった場合は勧告や命令を行う。","個人情報保護法の目的は、個人情報の有用性に配慮しつつ、個人の権利利益を保護することである。","2017年には個人情報保護法が改正された。"],"answer":[4],"type":"single","summary":"4, 不適切：改正法が成立したのは2015年で、2017年は全面施行の年です。\n1, 適切：個人情報保護法は2003年に成立し、2005年4月に全面施行されました。\n2, 適切：委員会の権限は、報告徴収・立入検査・指導・助言・勧告・命令までです。\n3, 適切：法律の第1条の目的規定にある内容です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：個人情報保護法（2003年成立・2005年全面施行）、2015年改正（2017年全面施行）、個人情報保護委員会、勧告・命令","url":null}]},{"num":52,"category":"活用・プロンプト","question":"テキスト生成AIにより処理可能なタスクとして最も不適切な記述を1つ選びなさい。","choices":["商品等の配送スケジュールを自動で管理することができる。","漢数字などをアラビア数字へ変換できる。","データを整理したりアンケートの分析ができる。","話者の設定を変更し、出力内容に専門性を持たせることができる。"],"answer":[1],"type":"single","summary":"1, 不適切（これが答え）：テキスト生成AIは、入力された文章に応答するものです。外部の配送システムと連携して、スケジュールを自動で管理し続けることはできません。\n2, 適切：表記の変換は、テキスト処理として得意なタスクです。\n3, 適切：データの整理や、アンケートの自由記述の分類・要約などができます。\n4, 適切：「あなたは○○の専門家です」などのロール設定で、専門的な回答をさせられます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：テキスト生成AI、ロールプロンプティング、表記変換、アンケート分析","url":null}]},{"num":53,"category":"生成AIの仕組み","question":"InstructGPTのベースになったモデルとして正しい選択肢を1つ選びなさい。","choices":["GPT-3","GPT-3.5","GPT-4","GPT-2"],"answer":[1],"type":"single","summary":"1, 正しい：InstructGPT（2022年1月発表）は、GPT-3をRLHFで調整し、人間の指示に従いやすくしたモデルです。\n2, ここが違う：GPT-3.5は、InstructGPTの技術を発展させた後継系列です。ChatGPTの初期モデルに使われました。\n3, ここが違う：GPT-4は2023年3月公開で、InstructGPTより後のモデルです。\n4, ここが違う：GPT-2は、GPT-3の前の世代のモデルです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：InstructGPT、GPT-3、RLHF、ChatGPT（GPT-3.5）","url":null}]},{"num":54,"category":"最新動向・サービス","question":"ChatGPTが自らPythonのソースコードを作成・実行することで、データ分析、グラフ作成、ファイル操作など様々なタスクを実行できるようになった機能の名称として、最も適切なものを次の中から選びなさい。","choices":["GPTs","Codex","Operator","Code Interpreter"],"answer":[4],"type":"single","summary":"4, 正しい：Code Interpreterは、ChatGPTがPythonコードを書き、その場で実行する機能です（後に「Advanced Data Analysis」に名称変更）。\n1, ここが違う：GPTsは、ChatGPTをカスタマイズしてオリジナル版を作る機能です。\n2, ここが違う：Codexは、コード生成・ソフトウェア開発向けのモデルやエージェントです。\n3, ここが違う：Operatorは、ブラウザを操作するAIエージェントです。","explanations":[],"keywords":[],"references":[{"label":"キーワード：Code Interpreter、Advanced Data Analysis、GPTs、Codex、Operator","url":null}]},{"num":55,"category":"最新動向・サービス","question":"ChatGPTで使用できる画像生成機能として採用されている、画像の左上から右下へトークンを一つずつ描いていく方式のモデルとして正しいものを、次の中から選びなさい。","choices":["サンドボックスモデル","仮想ブラウザモデル","自己回帰モデル","拡散モデル"],"answer":[3],"type":"single","summary":"3, 正しい：ChatGPTの画像生成（GPT-4oの画像生成）は、自己回帰モデルです。文章を1トークンずつ生成するのと同じように、画像を左上から右下へ順番に生成します。\n4, ここが違う：拡散モデルは、ノイズから画像全体を少しずつ復元する方式です。DALL·E 3やSora、Stable Diffusionはこちらです。ひっかけの選択肢です。\n1, ここが違う：サンドボックスは、プログラムを隔離された安全な環境で実行する仕組みです。モデルの方式ではありません。\n2, ここが違う：仮想ブラウザは、Operatorなどがウェブ操作に使う環境です。画像生成とは関係ありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：自己回帰モデル、拡散モデル、GPT-4o画像生成（2025年3月）、DALL·E 3との違い","url":null}]},{"num":56,"category":"AIの基礎","question":"レベル2のAIが利用されている代表例として、正しい選択肢を1つ選びなさい。","choices":["チャットボットや音声認識システム","AI搭載のエアコンの冷却制御","車の自動運転技術","検索エンジン"],"answer":[1],"type":"single","summary":"AIのレベル分類（松尾豊氏による4段階）の問題です。\n\nレベル1：単純な制御プログラム（温度に応じてエアコンを制御するなど）\nレベル2：古典的な人工知能。探索・推論や知識ベースを使い、入力に対する対応パターンが多いもの\nレベル3：機械学習を取り入れた人工知能\nレベル4：ディープラーニングを取り入れた人工知能\n\n1, 正しい：あらかじめ用意したルールや知識をもとに多様な質問に応答するチャットボットなどは、レベル2の代表例とされます。\n2, ここが違う：温度に応じた単純な冷却制御は、レベル1（単純な制御プログラム）の例です。\n3, ここが違う：自動運転は、画像認識などにディープラーニングを使うため、レベル4の例です。\n4, ここが違う：検索エンジンは、データから学習して検索結果を最適化するため、レベル3（機械学習）の例です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：AIのレベル分類（レベル1〜4）、古典的な人工知能、知識ベース、松尾豊『人工知能は人間を超えるか』","url":null}]},{"num":57,"category":"生成AIの仕組み","question":"GANの一般的な特性を表す文章として不適切な記述を1つ選びなさい。","choices":["識別器は生成器の生成したデータと正解データを区別する能力を持つ。","データを圧縮する能力が主な特徴である。","生成器は正解データと近いデータを生成する能力を持つ。","訓練データから新しいデータを生成することができる。"],"answer":[2],"type":"single","summary":"2, 不適切（これが答え）：データを潜在空間に圧縮するのは、オートエンコーダやVAEの特徴です。GANの主な特徴は、生成器と識別器を競わせること（敵対的学習）にあります。\n1, 適切：識別器は、入力されたデータが本物か生成器が作った偽物かを見分けます。\n3, 適切：生成器は、識別器をだませるほど本物に近いデータを作るよう学習します。\n4, 適切：学習したデータの特徴をもとに、新しいデータを生成できます。","explanations":[],"keywords":[],"references":[{"label":"キーワード：GAN（敵対的生成ネットワーク）、生成器（Generator）、識別器（Discriminator）、VAE、オートエンコーダ","url":null}]},{"num":58,"category":"AIの基礎","question":"ニューラルネットワークにおける「重みづけ」について正しく説明している文章を1つ選びなさい。","choices":["ニューラルネットワークの特定の層を増やすことによって、その層の重要性を高める手法のこと。","ニューラルネットワークの一部の動作を停止させること。","学習データの量を増やすことで、そのデータの重要性を高める手法のこと。","各ノードに入力される情報の重要度の調整をすること。"],"answer":[4],"type":"single","summary":"4, 正しい：重みは、各ノードへの入力にかける係数です。どの入力をどれだけ重視するかを表し、学習（誤差逆伝播法）によって調整されます。\n1, ここが違う：層を増やすのは、ネットワークを深くすること（ディープ化）です。重みづけではありません。\n2, ここが違う：一部のノードの動作を止めるのは、ドロップアウトの説明です。\n3, ここが違う：学習データを増やすのは、データ拡張などの話です。重みづけとは別物です。","explanations":[],"keywords":[],"references":[{"label":"キーワード：重み（weight）、バイアス、活性化関数、誤差逆伝播法、ドロップアウト","url":null}]},{"num":59,"category":"リスク・法律・倫理","question":"AI生成物に関連する権利を表した文章として不適切な記述を1つ選びなさい。","choices":["AI生成物が名誉毀損に該当する表現を含む場合、名誉を毀損されたと主張する者から、法的な措置が取られる可能性がある。","AI生成物は、申告しない限り著作物性が認められないため、予め申告により正当な権利を有していることを示す必要がある。","名誉毀損はそれ自体が違法行為であり、刑事上、3年以下の拘禁刑又は50万円以下の罰金が科される。","人がAIを道具として用いた生成物には、人による創作物として著作物性が認められる場合がある。"],"answer":[2],"type":"single","summary":"2, 不適切（これが答え）：日本の著作権は「無方式主義」です。作品を創作した時点で自動的に権利が発生し、申告や登録は必要ありません。「申告しない限り著作物性が認められない」は誤りです。\n1, 適切：AIが作った文章や画像でも、他人の社会的評価を下げる内容なら、民事・刑事の責任を問われる可能性があります。\n3, 適切：刑法230条の名誉毀損罪の法定刑は、3年以下の拘禁刑（2025年6月から懲役・禁錮が一本化）または50万円以下の罰金です。\n4, 適切：AIが自律的に作ったものは原則として著作物になりません。ただし、人が創作的な意図を持ち、具体的な指示や加筆などの「創作的寄与」をした場合は、著作物と認められることがあります。","explanations":[],"keywords":[],"references":[{"label":"キーワード：無方式主義、著作物性、創作的寄与、名誉毀損罪（刑法230条）、拘禁刑","url":null},{"label":"文化庁「AIと著作権に関する考え方について」","url":null}]},{"num":60,"category":"生成AIの仕組み","question":"LMを正しく説明している記述を1つ選びなさい。","choices":["音楽生成のための確率モデルである。","文章が自然言語としてどれだけ自然であるかを評価するモデルである。","画像処理のためのモデルである。","文章の添削を目的として設計されている。"],"answer":[2],"type":"single","summary":"2, 正しい：LM（言語モデル）は、単語の並びがどれくらいの確率で現れるか、つまり文章としてどれだけ自然かを確率で表すモデルです。この仕組みで「次に来る単語」を予測することで、文章の生成にも使われます。これを大規模化したものがLLMです。\n1, ここが違う：LMは言語（テキスト）を扱うモデルです。音楽生成専用のモデルではありません。\n3, ここが違う：画像処理には、CNNや拡散モデルなどが使われます。\n4, ここが違う：添削は言語モデルの応用例の1つにすぎません。添削を目的に設計されたモデルではありません。","explanations":[],"keywords":[],"references":[{"label":"キーワード：言語モデル（LM）、大規模言語モデル（LLM）、次単語予測、確率モデル、N-gram","url":null}]}];
const KEY='genai-passport-study-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={answers:{},saved:[],last:1},page='home',queue=[],position=0,selected=[],revealed=false,filter='all',category='all',search='',sessionLabel='全問題',storageOK=true;
const valid=a=>Array.isArray(a)&&a.length>0&&new Set(a).size===a.length&&a.every(n=>Number.isInteger(n)&&n>=1&&n<=4);
const same=(a,b)=>valid(a)&&a.length===b.length&&a.every(n=>b.includes(n));
function storageWarning(){storageOK=false;$('save-status').textContent='保存できません';$('notice').textContent='この環境では記録を保存できません。開いている間は学習できますが、閉じると今回の記録は消えます。';$('notice').classList.remove('hidden')}
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.answers&&typeof s.answers==='object'){for(const q of DATA)if(valid(s.answers[q.num]))state.answers[q.num]=s.answers[q.num];state.saved=Array.isArray(s.saved)?s.saved.filter(n=>DATA.some(q=>q.num===n)):[];state.last=DATA.some(q=>q.num===s.last)?s.last:1}}else{const old=JSON.parse(localStorage.getItem('genai-passport-source-20260921-v1')||'null');if(old&&old.ua){for(const q of DATA)if(valid(old.ua[q.num]))state.answers[q.num]=old.ua[q.num];if(DATA.some(q=>q.num===old.num))state.last=old.num}}localStorage.setItem(KEY,JSON.stringify(state))}catch{storageWarning()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{storageWarning()}}
const done=q=>!!state.answers[q.num];const correct=q=>done(q)&&same(state.answers[q.num],q.answer);
const cats=[...new Set(DATA.map(q=>q.category))];
function go(next){page=next;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();else listPage();window.scrollTo({top:0})}
function home(){const answered=DATA.filter(done).length,ok=DATA.filter(correct).length,wrong=answered-ok,pct=Math.round(answered/DATA.length*100);$('app').innerHTML=`<section class="hero"><div><div class="eyebrow">YOUR LEARNING JOURNEY</div><h1>今日の一問が、<br>自信につながる。</h1><p>選んで、理解して、もう一度。生成AIを自分の知識に。</p></div><div class="ring" style="--progress:${pct}" aria-label="学習進捗 ${pct}%"><div class="ring-inner"><strong>${pct}<span style="font-size:13px">%</span></strong><small>学習の進捗</small></div></div></section><div class="stats"><div class="stat"><span>回答した問題</span><strong>${answered}<small>/ 60 問</small></strong></div><div class="stat"><span>正解した問題</span><strong>${ok}<small>問</small></strong></div><div class="stat"><span>回答済みの正答率</span><strong>${answered?Math.round(ok/answered*100):'—'}<small>${answered?'%':''}</small></strong></div></div><section class="start-grid"><div class="continue"><div class="eyebrow">KEEP GOING</div><h2>${answered?'自分のペースで、続きを。':'最初の一問から、始めよう。'}</h2><button class="btn white" onclick="start('all',true)">${answered?'続きから学習':'学習をはじめる'} <span>→</span></button><p>全60問 · 解答後に解説をチェック</p></div><div class="review"><div class="eyebrow">TRY AGAIN</div><h2>苦手を、得意に変える。</h2><p>${wrong?`間違えた ${wrong} 問を、もう一度。`:'間違えた問題がここに集まります。'}</p><button class="btn ghost" onclick="start('wrong')" ${wrong?'':'disabled'}>苦手を復習 <span>↗</span></button></div></section><div class="section-head"><h2>分野から学ぶ</h2><span>気になるテーマをひとつずつ</span></div><div class="topics">${cats.map((c,i)=>{const qs=DATA.filter(q=>q.category===c),n=qs.filter(correct).length;return `<button class="topic" onclick="startTopic(${i})"><div class="topic-title"><span class="topic-icon">0${i+1}</span><h3>${esc(c)}</h3><span style="margin-left:auto;color:#8d9b8d">↗</span></div><div class="topic-meta"><span>全 ${qs.length} 問</span><span>${n} 問正解 / ${qs.filter(done).length} 問回答済み</span></div><div class="bar"><div style="width:${n/qs.length*100}%"></div></div></button>`}).join('')}</div><div class="section-head"><h2>ちょっと違う進め方</h2></div><div class="mini-actions"><button class="btn ghost" onclick="start('unanswered')">未回答だけ解く</button><button class="btn ghost" onclick="start('random')">ランダムで10問</button><button class="btn ghost" onclick="go('list')">問題を探す</button></div><p class="footnote">「問題文.txt」の全60問・解説を収録。記録はこのブラウザに保存されます。</p>`}
function startTopic(i){begin(DATA.filter(q=>q.category===cats[i]),cats[i])}
function start(mode,resume=false){let qs=DATA.slice();if(mode==='wrong')qs=qs.filter(q=>done(q)&&!correct(q));if(mode==='unanswered')qs=qs.filter(q=>!done(q));if(mode==='saved')qs=qs.filter(q=>state.saved.includes(q.num));if(mode==='random'){for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}qs=qs.slice(0,10)}begin(qs,({wrong:'苦手を復習',unanswered:'未回答の問題',random:'ランダム10問',saved:'あとで復習'})[mode]||'全問題',resume?state.last:null)}
function begin(qs,label,num=null){queue=qs;position=Math.max(0,qs.findIndex(q=>q.num===num));sessionLabel=label;page='quiz';document.querySelectorAll('[data-page]').forEach(b=>b.classList.remove('active'));prepare()}
function prepare(){selected=[];revealed=false;if(queue.length){state.last=queue[position].num;save()}quiz();window.scrollTo({top:0})}
function quiz(){if(!queue.length){$('app').innerHTML=`<div class="empty"><div class="eyebrow">ALL CLEAR</div><h1>今は、対象の問題がありません。</h1><p>別の分野に挑戦したり、問題一覧から選んだりできます。</p><button class="btn" onclick="go('home')">学習ホームへ</button></div>`;return}const q=queue[position],ok=same(selected,q.answer),book=state.saved.includes(q.num);$('app').innerHTML=`<div class="quiz-top"><button class="textbtn" onclick="go('home')">← 学習ホーム</button><div class="quiz-progress">${esc(sessionLabel)} <span style="float:right">${position+1} / ${queue.length}</span><div class="bar"><div style="width:${(position+1)/queue.length*100}%"></div></div></div></div><article class="question-card"><div class="qmeta"><span class="tag">${esc(q.category)}</span><button class="bookmark ${book?'on':''}" id="bookmark" aria-pressed="${book}" onclick="bookmark()">${book?'★ 復習に保存済み':'☆ あとで復習'}</button></div><div class="qnum">QUESTION ${String(q.num).padStart(2,'0')} <span style="float:right">${q.type==='multi'?'複数選択':'単一選択'}</span></div>${q.type==='multi'?`<div class="selection-guide"><strong>☑ 複数選択</strong><span>当てはまるものを<strong style="font-size:inherit">すべて</strong>選択</span><div class="selection-count" id="selection-count" aria-live="polite">${selected.length}個 選択中</div></div>`:''}<h1 class="question" id="question">${esc(q.question)}</h1><div class="instruction">${q.type==='multi'?'当てはまるものをすべて選んでください。':'選択肢を1つ選んでください。'}${done(q)&&!revealed?'　前回：'+(correct(q)?'正解':'不正解'):''}</div><div class="choices" role="group" aria-labelledby="question">${q.choices.map((text,i)=>{const n=i+1,picked=selected.includes(n),right=q.answer.includes(n);return `<label class="choice ${revealed?(right?'right':picked?'wrong':''):''}"><input type="${q.type==='multi'?'checkbox':'radio'}" name="choice" value="${n}" ${picked?'checked':''} ${revealed?'disabled':''} onchange="pick(${n},this.checked)"><span class="n">0${n}</span><span>${esc(text)}</span>${revealed&&(right||picked)?`<span class="mark">${right?'✓ 正解':'×'}</span>`:''}</label>`}).join('')}</div><div class="qactions"><small>${revealed?'理解できたら、次の問題へ。':'選択してから答え合わせ。焦らず考えましょう。'}</small>${revealed?`<button class="btn ghost" onclick="prepare()">もう一度解く ↻</button>`:`<button class="btn" id="check" onclick="check()" ${selected.length?'':'disabled'}>答え合わせ →</button>`}</div><div id="feedback" role="status" aria-live="polite"></div></article><div class="quiz-nav"><button class="btn ghost" onclick="move(-1)" ${position===0?'disabled':''}>← 前の問題</button><button class="btn" onclick="move(1)">${position===queue.length-1?'学習をまとめる ✓':'次の問題 →'}</button></div>`;if(revealed){$('feedback').innerHTML=`<section class="feedback ${ok?'':'incorrect'}"><div class="result-banner"><div class="result-symbol" aria-hidden="true">${ok?'✓':'×'}</div><div><h3>${ok?'正解':'不正解'}</h3><p>${ok?(q.type==='multi'?'選んだ組み合わせがすべて一致しています。':'選んだ答えが一致しています。'):'正解との違いを、下の解説で確認しましょう。'}</p></div></div><div class="answer-pills"><span>正解 ${q.answer.map(n=>'<b>'+n+'</b>').join('')}</span><span>あなたの回答 ${selected.map(n=>'<b>'+n+'</b>').join('')}</span></div><h3 class="explain-heading">選択肢ごとの解説</h3>${explain(q)}${q.references.length?`<details><summary>キーワード・参考資料を見る</summary><ul class="refs">${q.references.map(r=>`<li>${r.url&&/^https?:\/\//.test(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)}</a>`:esc(r.label)}</li>`).join('')}</ul></details>`:''}</section>`}}
function emphasize(text){const match=text.match(/^([\s\S]*?[。！？])([\s\S]*)$/);return match?'<strong>'+esc(match[1])+'</strong>'+esc(match[2]):'<strong>'+esc(text)+'</strong>'}
function explain(q){const text=q.summary;const parts=[...text.matchAll(/^([1-4])[,，、.．]\s*([^\n：:]+)[：:]\s*([\s\S]*?)(?=^[1-4][,，、.．]\s*[^\n：:]+[：:]|$(?![\s\S]))/gm)];if(!parts.length)return '<div class="explain-extra">'+emphasize(text)+'</div>';let html=text.slice(0,parts[0].index).trim();html=html?'<div class="explain-extra">'+esc(html)+'</div>':'';return html+parts.map(m=>'<section class="explain-item '+(q.answer.includes(+m[1])?'answer':'')+'"><div class="explain-title"><b>'+m[1]+'</b><span>'+esc(m[2])+'</span>'+(q.answer.includes(+m[1])?'<small>正解の選択肢</small>':'')+'</div><div class="explain-body">'+emphasize(m[3].trim())+'</div></section>').join('')}
function pick(n,on){const q=queue[position];if(revealed)return;if(q.type==='single')selected=[n];else selected=on?[...new Set([...selected,n])]:selected.filter(v=>v!==n);$('check').disabled=!selected.length;if(q.type==='multi')$('selection-count').textContent=selected.length+'個 選択中'}
function check(){if(!selected.length||revealed)return;revealed=true;state.answers[queue[position].num]=selected.slice();save();quiz();$('feedback').scrollIntoView({behavior:'smooth',block:'nearest'})}
function bookmark(){const n=queue[position].num;state.saved=state.saved.includes(n)?state.saved.filter(v=>v!==n):[...state.saved,n];save();const b=$('bookmark'),on=state.saved.includes(n);b.textContent=on?'★ 復習に保存済み':'☆ あとで復習';b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))}
function move(d){if(position+d>=queue.length){finish();return}position=Math.max(0,position+d);prepare()}
function finish(){const n=queue.filter(done).length,ok=queue.filter(correct).length;$('app').innerHTML=`<div class="empty"><div class="eyebrow">NICE WORK</div><h1>ひと区切り、おつかれさまでした。</h1><p>${esc(sessionLabel)} · ${queue.length}問中 ${n}問回答 / ${ok}問正解<br>この集計には、以前の回答も含まれます。</p><div class="mini-actions" style="justify-content:center"><button class="btn" onclick="go('home')">学習ホームへ</button><button class="btn ghost" onclick="start('wrong')">苦手を復習する</button></div></div>`;window.scrollTo({top:0})}
function listPage(){const saved=page==='saved';$('app').innerHTML=`<div class="eyebrow">${saved?'YOUR BOOKMARKS':'QUESTION LIBRARY'}</div><h1>${saved?'あとで復習する問題':'気になる一問を、見つけよう。'}</h1><p>${saved?'星をつけた問題をまとめて振り返れます。':'キーワードや分野から、学びたい問題を探せます。'}</p>${saved?'<button class="btn ghost" onclick="start(\'saved\')" style="margin-top:12px">保存した問題を解く →</button>':''}<div class="filters"><input type="search" id="search" aria-label="問題を検索" placeholder="キーワードで検索（例：Transformer）" value="${esc(search)}" oninput="search=this.value;renderRows()"><select id="category" aria-label="分野で絞り込む" onchange="category=this.value;renderRows()"><option value="all">すべての分野</option>${cats.map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select aria-label="回答状況で絞り込む" onchange="filter=this.value;renderRows()">${[['all','すべての問題'],['unanswered','未回答'],['wrong','不正解'],['correct','正解']].map(([v,t])=>`<option value="${v}" ${filter===v?'selected':''}>${t}</option>`).join('')}</select></div><p id="count" style="font-size:12px" aria-live="polite"></p><div class="question-list" id="rows"></div>`;renderRows()}
function matches(){return DATA.filter(q=>(page!=='saved'||state.saved.includes(q.num))&&(category==='all'||q.category===category)&&(filter==='all'||filter==='unanswered'&&!done(q)||filter==='wrong'&&done(q)&&!correct(q)||filter==='correct'&&correct(q))&&(q.question+' '+q.choices.join(' ')).toLowerCase().includes(search.trim().toLowerCase()))}
function renderRows(){const qs=matches();$('count').textContent=qs.length+' 問';$('rows').innerHTML=qs.length?qs.map(q=>`<button class="list-row" onclick="openQuestion(${q.num})"><span class="list-no">${String(q.num).padStart(2,'0')}</span><span class="list-title"><small>${esc(q.category)} ${q.type==='multi'?' · 複数選択':''}</small>${esc(q.question)}</span><span class="list-state">${state.saved.includes(q.num)?'★ ':''}${done(q)?correct(q)?'✓ 正解':'↻ 復習':'未回答'} →</span></button>`).join(''):'<div class="empty"><h2>該当する問題がありません。</h2><p>検索条件を変えるか、問題画面の「☆ あとで復習」で保存してください。</p></div>'}
function openQuestion(n){begin(matches(),'選んだ問題',n)}
go('home');
</script>
</body>
</html>
